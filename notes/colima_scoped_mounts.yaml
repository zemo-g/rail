# Proposed scoped mounts for ~/.colima/default/colima.yaml
# Replaces `mounts: []` (which means $HOME passthrough = /Users/user fully writable in VM).
#
# Rationale (2026-05-12):
#   - /Users/user/projects: all build/deploy/test scripts live here.
#   - /Users/user/.cache/rail-x86-conformance: tools/test/x86_conformance.sh
#     stages asm under STAGE="$HOME/.cache/rail-x86-conformance" and runs
#     `docker run --rm --platform=linux/amd64 -v "$STAGE":/stage gcc:latest`.
#     The mount must be visible to the Linux container, which means visible
#     to the Colima VM that hosts dockerd. Keep.
#   - /Users/user/.cache/rail-x86-bitops-smoke: tools/test/x86_bitops_smoke.sh
#     does the same pattern with STAGE="$HOME/.cache/rail-x86-bitops-smoke".
#     Keep.
#
# Result: ~/.ssh, ~/.aws, ~/.config, ~/Library, etc. become invisible to
# containers, closing the audit's `virtfs path=/Users/user` finding.

mounts:
  - location: /Users/user/projects
    writable: true
  - location: /Users/user/.cache/rail-x86-conformance
    writable: true
  - location: /Users/user/.cache/rail-x86-bitops-smoke
    writable: true
