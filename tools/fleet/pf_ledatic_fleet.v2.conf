# pf_ledatic_fleet.v2.conf — fleet control-plane firewall, IPv4 + IPv6.
#
# Installed at /etc/pf.anchors/ledatic_fleet by security_bootstrap.sh.
# Loaded from /etc/pf.conf via:
#   anchor "ledatic_fleet"
#   load anchor "ledatic_fleet" from "/etc/pf.anchors/ledatic_fleet"
#
# Trusted sources (both families):
#   IPv4:  127.0.0.0/8      loopback
#          10.42.0.0/24     TB bridge mesh
#          100.64.0.0/10    Tailscale CGNAT
#   IPv6:  ::1              loopback
#          fe80::/10        link-local (direct TB peers)
#          fd7a:115c:a1e0::/48   Tailscale IPv6 (ULA block)
#
# Everything else — LAN Wi-Fi, WAN, stray Tailscale peers on other
# subnets — is dropped.  `quick` on the pass rules means first match
# wins.

# ── Fleet control plane :9101 ───────────────────────────────────────────
# IPv4
block in inet proto tcp from any to any port 9101
pass in quick inet proto tcp from 127.0.0.0/8   to any port 9101
pass in quick inet proto tcp from 10.42.0.0/24  to any port 9101
pass in quick inet proto tcp from 100.64.0.0/10 to any port 9101
# IPv6
block in inet6 proto tcp from any to any port 9101
pass in quick inet6 proto tcp from ::1 to any port 9101
pass in quick inet6 proto tcp from fe80::/10 to any port 9101
pass in quick inet6 proto tcp from fd7a:115c:a1e0::/48 to any port 9101

# ── Local TLS proxies (socat: 8443/8444/8445) ──────────────────────────
# These should already be localhost-only; belt-and-suspenders in case a
# future socat invocation binds broader.
block in inet proto tcp from any to any port { 8443 8444 8445 }
pass in quick inet proto tcp from 127.0.0.0/8 to any port { 8443 8444 8445 }
block in inet6 proto tcp from any to any port { 8443 8444 8445 }
pass in quick inet6 proto tcp from ::1 to any port { 8443 8444 8445 }
