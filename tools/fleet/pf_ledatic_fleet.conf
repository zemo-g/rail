# pf_ledatic_fleet.conf — packet filter anchor for fleet nodes
#
# Installed at /etc/pf.anchors/ledatic_fleet and loaded from /etc/pf.conf.
# Purpose: block the fleet control plane (:9101) and the TLS-proxy ports
# (:8443 / :8444 / :8445) from any non-trusted source.  Trusted sources:
#
#   127.0.0.0/8       loopback
#   10.42.0.0/24      TB bridge mesh (fleet nodes only)
#   100.64.0.0/10     Tailscale CGNAT (your tailnet)
#
# Everything else — including LAN Wi-Fi and WAN — is dropped.
#
# The `quick` keyword on the pass rules means pf short-circuits on first
# match, so order: block broad → pass narrow.

# ── Fleet control plane :9101 ───────────────────────────────────────────
block in proto tcp from any to any port 9101
pass in quick proto tcp from 127.0.0.0/8   to any port 9101
pass in quick proto tcp from 10.42.0.0/24  to any port 9101
pass in quick proto tcp from 100.64.0.0/10 to any port 9101

# ── Local TLS proxies (socat): legacy Rail→Anthropic/Slack/CF paths ────
# These should already be localhost-only, but belt-and-suspenders:
block in proto tcp from any to any port { 8443 8444 8445 }
pass in quick proto tcp from 127.0.0.0/8 to any port { 8443 8444 8445 }
