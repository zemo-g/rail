<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>live OT plasma — embed</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="plasma"></canvas>
<script>
"use strict";
const N = 128;
const PLANE_BYTES = 6 * N * N * 4;
const HEADER_BYTES = 16;
const METRICS_BYTES = 32;
const FRAME_URL = (location.host === "liveplasma.ledatic.org" || location.host.startsWith("localhost"))
  ? "/frame"
  : "https://liveplasma.ledatic.org/frame";

const canvas = document.getElementById("plasma");
const ctx = canvas.getContext("2d");
canvas.width = N;
canvas.height = N;
const imgData = ctx.createImageData(N, N);
const px = imgData.data;

function rangeOf(arr){
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < arr.length; i++){ const v = arr[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  return [lo, hi];
}

function paintFrame(buf){
  const dv = new DataView(buf);
  if (dv.getUint32(0, true) !== N) return;
  const planes = new Float32Array(buf, HEADER_BYTES + METRICS_BYTES, 6 * N * N);
  const rho = planes.subarray(0, N * N);
  const bx  = planes.subarray(4 * N * N, 5 * N * N);
  const by  = planes.subarray(5 * N * N, 6 * N * N);
  const [r_lo, r_hi] = rangeOf(rho);
  const r_span = Math.max(r_hi - r_lo, 1e-9);
  let b_lo = Infinity, b_hi = -Infinity;
  const bmag = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++){
    const v = Math.hypot(bx[i], by[i]);
    bmag[i] = v;
    if (v < b_lo) b_lo = v;
    if (v > b_hi) b_hi = v;
  }
  const b_span = Math.max(b_hi - b_lo, 1e-9);
  for (let y = 0; y < N; y++){
    const yy = N - 1 - y;
    const dst_row = y * N * 4;
    const src_row = yy * N;
    for (let x = 0; x < N; x++){
      const i = src_row + x;
      const r_n = Math.min(1, Math.max(0, (rho[i] - r_lo) / r_span));
      const b_n = Math.min(1, Math.max(0, (bmag[i] - b_lo) / b_span));
      const r_p = Math.pow(r_n, 0.8);
      const b_p = Math.pow(b_n, 1.6) * 0.55;
      const r = (10 + (69 - 10) * r_p) + 115 * b_p;
      const g = (15 + (217 - 15) * r_p) + 242 * b_p;
      const b = (13 + (112 - 13) * r_p) + 255 * b_p;
      const o = dst_row + x * 4;
      px[o] = Math.min(255, r) | 0;
      px[o+1] = Math.min(255, g) | 0;
      px[o+2] = Math.min(255, b) | 0;
      px[o+3] = 255;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

let inFlight = false;
async function tick(){
  if (inFlight) return;
  inFlight = true;
  try {
    const r = await fetch(FRAME_URL, { cache: "no-store" });
    if (!r.ok) return;
    const buf = await r.arrayBuffer();
    if (buf.byteLength === HEADER_BYTES + METRICS_BYTES + PLANE_BYTES) paintFrame(buf);
  } catch (e) { /* silent — embed has no UI to show errors */ }
  finally { inFlight = false; }
}
setInterval(tick, 100);
tick();
</script>
</body>
</html>
