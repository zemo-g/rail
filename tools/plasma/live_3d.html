<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RAIL PLASMA — Live 3D vortex</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06060a; color:#c0c0c0;
               font-family: ui-monospace, 'SF Mono', Menlo, monospace; overflow:hidden; }
  #hud { position:absolute; top:0; left:0; right:0; z-index:10;
         background:linear-gradient(180deg, rgba(10,10,18,0.92), rgba(10,10,18,0));
         padding:10px 16px 30px 16px; pointer-events:none; }
  #title { font-size:13px; letter-spacing:2px; color:#e0e0e8; }
  #title .sub { color:#556; font-size:10px; }
  #metrics { margin-top:6px; font-size:12px; display:flex; gap:22px; color:#889; }
  .m { display:flex; gap:6px; }
  .mk { color:#667; }
  .mv { color:#c0c0c0; font-weight:600; min-width: 70px; display:inline-block; }
  .mv.thrust { color:#ff8a50; }
  .mv.isp { color:#8cf; }
  .mv.eff { color:#c9a84c; }
  #legend { position:absolute; bottom:14px; left:14px; font-size:10px; color:#667;
            background:rgba(10,10,18,0.7); padding:6px 10px; border:1px solid #1a1a24;
            border-radius:3px; }
  .sw { display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:middle; }
  #status { position:absolute; bottom:14px; right:14px; font-size:10px; color:#667; }
  #status.bad { color:#f55; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud">
  <div id="title">RAIL PLASMA <span class="sub">live 3D · run 29 · exp #2 vortex · axisym MHD + analytic swirl overlay</span></div>
  <div id="metrics">
    <div class="m"><span class="mk">T:</span><span class="mv thrust" id="t_mN">—</span><span class="mk">mN</span></div>
    <div class="m"><span class="mk">ISP:</span><span class="mv isp" id="t_isp">—</span><span class="mk">s</span></div>
    <div class="m"><span class="mk">v_e:</span><span class="mv" id="t_ve">—</span><span class="mk">km/s</span></div>
    <div class="m"><span class="mk">P:</span><span class="mv" id="t_P">—</span><span class="mk">W</span></div>
    <div class="m"><span class="mk">η:</span><span class="mv eff" id="t_eff">—</span><span class="mk">%</span></div>
    <div class="m"><span class="mk">sim_t:</span><span class="mv" id="t_sim">—</span><span class="mk">μs</span></div>
    <div class="m"><span class="mk">frame:</span><span class="mv" id="t_frame">—</span></div>
  </div>
</div>
<div id="legend">
  <div><span class="sw" style="background:#c9a84c"></span>coils (inlet strong / exit 1/9.9)</div>
  <div><span class="sw" style="background:#ff8a50"></span>helical flow paths (6 injectors)</div>
  <div><span class="sw" style="background:linear-gradient(90deg,#000,#ff8a50,#ffea80)"></span>density (r,z) slice, magma</div>
  <div><span class="sw" style="background:#6cf"></span>chamber + injector arrows</div>
</div>
<div id="status">connecting…</div>
<canvas id="c"></canvas>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Run 29 geometry (mm for display, scale factor doesn't matter)
const SCALE = 1000;  // meters → mm
const RC = 0.005 * SCALE;
const R  = 0.054 * SCALE;
const L  = 0.377 * SCALE;
const GRAD = 9.9;
const N_INJ = 6;
const SWIRL = 3.6;

// ───── three.js scene
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x06060a);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x06060a, L*2, L*5);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 1, L*10);
camera.position.set(L*1.5, R*6, L*0.7);
camera.lookAt(0, 0, L*0.5);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, L*0.5);
controls.enableDamping = true;

// lights
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.7);
keyLight.position.set(L, R*4, L*0.5);
scene.add(keyLight);

// ───── chamber wireframe
{
  const geo = new THREE.CylinderGeometry(R, R, L, 48, 1, true);
  geo.rotateX(Math.PI/2);    // cylinder axis → z
  geo.translate(0, 0, L/2);
  const edges = new THREE.EdgesGeometry(geo, 5);
  const mat = new THREE.LineBasicMaterial({ color: 0x6cf, transparent:true, opacity:0.35 });
  scene.add(new THREE.LineSegments(edges, mat));
  // translucent shell
  const shellMat = new THREE.MeshBasicMaterial({ color: 0x6cf, side: THREE.DoubleSide,
    transparent:true, opacity:0.05 });
  scene.add(new THREE.Mesh(geo, shellMat));
}

// ───── coil rings (2)
function addCoil(zFrac, brightness) {
  const torus = new THREE.TorusGeometry(R*1.22, R*0.06, 16, 48);
  torus.rotateX(Math.PI/2);
  torus.translate(0, 0, L*zFrac);
  const mat = new THREE.MeshPhongMaterial({ color: 0xc9a84c, emissive: 0x443322,
    emissiveIntensity: brightness, shininess: 40, transparent:true, opacity:0.88 });
  scene.add(new THREE.Mesh(torus, mat));
}
addCoil(0.15, 1.0);
addCoil(0.85, 1.0/GRAD);

// ───── (r,z) density slice — THIS is what the sim drives
const DSR = 64, DSZ = 128;
const texData = new Uint8Array(DSR * DSZ * 4);  // RGBA bytes
for (let i=0;i<texData.length;i+=4) { texData[i]=0; texData[i+1]=0; texData[i+2]=0; texData[i+3]=255; }
const texture = new THREE.DataTexture(texData, DSZ, DSR, THREE.RGBAFormat);
texture.magFilter = THREE.LinearFilter;
texture.minFilter = THREE.LinearFilter;
texture.needsUpdate = true;

// The plane shows the FULL diameter (both sides) by mirroring rows about r=0.
// We use a bigger texture (2*DSR × DSZ) so both halves are drawn.
const fullRows = 2 * DSR;
// Texture: width = diameter (2*DSR), height = axial (DSZ)
// so UV's u-axis maps to diameter, v-axis maps to axial.
const fullTexData = new Uint8Array(fullRows * DSZ * 4);
const fullTex = new THREE.DataTexture(fullTexData, fullRows, DSZ, THREE.RGBAFormat);
fullTex.magFilter = THREE.LinearFilter;
fullTex.minFilter = THREE.LinearFilter;

{
  // Plane: width=2R (x), height=L (was y, rotated to z), normal=y.
  // Lies flat inside the chamber as a diametric axial slice.
  const pg = new THREE.PlaneGeometry(2*R, L);
  pg.rotateX(-Math.PI/2);
  pg.translate(0, 0, L/2);
  const pm = new THREE.MeshBasicMaterial({ map: fullTex, side: THREE.DoubleSide,
    transparent:true, opacity:0.95, depthWrite:false });
  scene.add(new THREE.Mesh(pg, pm));
}

// ───── helical injector paths (analytic)
function helicalPath(theta0) {
  const pts = [];
  const r0 = R * 0.7, vphi0 = SWIRL * 500, v_ax = 1500;
  const Lc = r0 * vphi0;
  const sigma = 0.1 * L;
  const bz_in = Math.exp(-Math.pow((0-0.15*L)/sigma,2)) + (1/GRAD)*Math.exp(-Math.pow((0-0.85*L)/sigma,2));
  let theta = theta0;
  let prevZ = 0;
  for (let k=0;k<300;k++) {
    const s = k/299;
    const z = s * L;
    const bz_z = Math.exp(-Math.pow((z-0.15*L)/sigma,2)) + (1/GRAD)*Math.exp(-Math.pow((z-0.85*L)/sigma,2));
    let rZ = r0 * Math.sqrt(bz_in / Math.max(bz_z, 0.05*bz_in));
    rZ = Math.min(rZ, R*0.97);
    if (pts.length > 0) {
      const dz = z - prevZ;
      const dt = dz / v_ax;
      theta += (Lc / (rZ*rZ)) * dt;
    }
    pts.push(new THREE.Vector3(rZ*Math.cos(theta), rZ*Math.sin(theta), z));
    prevZ = z;
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0xff8a50, transparent:true, opacity:0.75 });
  scene.add(new THREE.Line(geo, mat));
}
for (let k=0;k<N_INJ;k++) helicalPath(2*Math.PI*k/N_INJ);

// ───── injector arrows at inlet (z=0)
for (let k=0;k<N_INJ;k++) {
  const th = 2*Math.PI*k/N_INJ;
  const x0 = R * Math.cos(th);
  const y0 = R * Math.sin(th);
  const tx = -Math.sin(th);
  const ty = Math.cos(th);
  // tangential + slight inward
  const dx = (tx*0.9 - Math.cos(th)*0.3) * R*0.3;
  const dy = (ty*0.9 - Math.sin(th)*0.3) * R*0.3;
  const pts = [new THREE.Vector3(x0,y0,0), new THREE.Vector3(x0+dx,y0+dy,0)];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x6cf });
  scene.add(new THREE.Line(geo, mat));
  // arrowhead sphere
  const s = new THREE.Mesh(new THREE.SphereGeometry(R*0.03, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0x6cf }));
  s.position.set(x0+dx, y0+dy, 0);
  scene.add(s);
}

// ───── axial exhaust arrow
{
  const geo = new THREE.ConeGeometry(R*0.1, R*0.3, 16);
  geo.rotateX(Math.PI/2);
  geo.translate(0, 0, L*1.08);
  const mat = new THREE.MeshPhongMaterial({ color: 0xc9a84c, emissive:0x553311, emissiveIntensity:0.6 });
  scene.add(new THREE.Mesh(geo, mat));
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,L), new THREE.Vector3(0,0,L*1.08)]),
    new THREE.LineBasicMaterial({ color: 0xc9a84c, transparent:true, opacity:0.7 })
  );
  scene.add(line);
}

// ───── magma colormap (approximate, fine for visual)
function magma(v) {
  // v in [0,1] → [r,g,b] 0-255
  v = Math.max(0, Math.min(1, v));
  // control points ~ matplotlib magma
  const stops = [
    [0.00, [0,   0,   4  ]],
    [0.15, [24,  15,  61 ]],
    [0.30, [76,  21,  96 ]],
    [0.50, [134, 29,  104]],
    [0.65, [187, 55,  84 ]],
    [0.80, [231, 106, 59 ]],
    [0.92, [251, 170, 91 ]],
    [1.00, [252, 253, 191]],
  ];
  let i = 0;
  while (i < stops.length-1 && v > stops[i+1][0]) i++;
  const [a, A] = [stops[i], stops[i+1]] || [stops[i], stops[i]];
  const t = (v - stops[i][0]) / (stops[i+1][0] - stops[i][0] + 1e-9);
  const r = a[1][0] + (A[1][0] - a[1][0]) * t;
  const g = a[1][1] + (A[1][1] - a[1][1]) * t;
  const b = a[1][2] + (A[1][2] - a[1][2]) * t;
  return [r|0, g|0, b|0];
}

// ───── frame fetching + density texture update
const FRAME_URL = 'http://localhost:9200/frame';
let lastFrameId = -1;
let consecutiveFails = 0;
const status = document.getElementById('status');

async function pollFrame() {
  try {
    const resp = await fetch(FRAME_URL, { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const buf = new Uint8Array(await resp.arrayBuffer());
    if (buf.length !== 196656) throw new Error('bad size ' + buf.length);
    const dv = new DataView(buf.buffer);
    const dsr = dv.getUint32(0, true);
    const dsz = dv.getUint32(4, true);
    const nf  = dv.getUint32(8, true);
    const fid = dv.getUint32(12, true);
    // metrics: [thrust_mN, ISP, ve(km/s), P_w, eff%, sim_time, I_arc, mdot(mg/s)]
    const m = [];
    for (let i=0;i<8;i++) m.push(dv.getFloat32(16 + i*4, true));
    document.getElementById('t_mN').textContent = m[0].toFixed(2);
    document.getElementById('t_isp').textContent = m[1].toFixed(0);
    document.getElementById('t_ve').textContent = m[2].toFixed(2);
    document.getElementById('t_P').textContent = m[3].toFixed(0);
    document.getElementById('t_eff').textContent = m[4].toFixed(1);
    document.getElementById('t_sim').textContent = (m[5] * 1e6).toFixed(2);
    document.getElementById('t_frame').textContent = fid;
    // Density (field 0) — find min/max for normalization
    const FIELD_OFFSET = 48;        // 16 header + 32 metrics
    const CELLS = dsr * dsz;
    const rho = new Float32Array(buf.buffer, FIELD_OFFSET, CELLS);
    let mn = Infinity, mx = -Infinity;
    for (let i=0;i<CELLS;i++) {
      const v = rho[i];
      if (!isFinite(v)) continue;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    if (!isFinite(mn) || !isFinite(mx) || mx - mn < 1e-20) { mn = 0; mx = 1; }
    // Build full-diameter texture. Texture is width=2*DSR (diametric, u), height=DSZ (axial, v).
    // Source layout: rho[j*DSZ + i]  where j = radial row, i = axial column.
    // Pixel (x_pix=diam, y_pix=axial) → byte index = (y_pix * 2*DSR + x_pix) * 4.
    const arr = fullTexData;
    for (let xp=0; xp<fullRows; xp++) {     // diameter pixel (0..2*DSR-1)
      const isNegSide = xp < DSR;
      const j = isNegSide ? (DSR - 1 - xp) : (xp - DSR);
      for (let yp=0; yp<DSZ; yp++) {        // axial pixel (0..DSZ-1)
        const val = rho[j*DSZ + yp];
        const t = isFinite(val) ? (val - mn) / (mx - mn) : 0;
        const [r,g,b] = magma(t);
        const idx = (yp * fullRows + xp) * 4;
        arr[idx] = r; arr[idx+1] = g; arr[idx+2] = b; arr[idx+3] = 240;
      }
    }
    fullTex.needsUpdate = true;
    lastFrameId = fid;
    consecutiveFails = 0;
    status.className = '';
    status.textContent = `live · frame ${fid} · ${dsr}×${dsz} density · ρ ∈ [${mn.toExponential(2)}, ${mx.toExponential(2)}]`;
  } catch (e) {
    consecutiveFails++;
    if (consecutiveFails > 5) {
      status.className = 'bad';
      status.textContent = 'no frames (' + e.message + ')';
    }
  }
}

setInterval(pollFrame, 200);
pollFrame();

// ───── animation
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
