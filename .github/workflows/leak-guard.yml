name: Leak guard

# Fail the build if any operator-recon string lands in the public tree.
# Patterns are the same set scrubbed in v4.0.1 (CHANGELOG.md entry).
# To intentionally include one of these strings (e.g. in a release note
# describing the scrub itself), put `leak-guard-allow` somewhere on the
# same line and the matcher will skip it.

on:
    push:
      branches: [master, main, next]
      tags: ['v*']
    pull_request:
      branches: [master, main, next]

jobs:
    grep:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Pattern scan
          shell: bash
          run: |
            set -e
            patterns='100\.87\.231\.45|100\.79\.50\.108|100\.109\.107\.54|100\.120\.203\.70|100\.109\.63\.37|zemog@|user@100|reillygomez@|ledaticempire@|/Users/ledaticempire|/Users/reillygomez|/Users/user|/home/zemog|\bDetro\b|D0ATHQ1BQD7|\bbrockbro2\b'
            # Scan all tracked text files; exclude:
            #   - the leak guard itself (documents the patterns)
            #   - CHANGELOG.md (records the scrubs)
            #   - releases/* (historical release snapshots, frozen by design;
            #     pre-v4 snapshots predate the sanitization and must not be
            #     rewritten without breaking their attestation chains)
            hits=$(git grep -nE "$patterns" -- \
              ':(exclude).github/workflows/leak-guard.yml' \
              ':(exclude)CHANGELOG.md' \
              ':(exclude)releases/' \
              | grep -v 'leak-guard-allow' || true)
            if [ -n "$hits" ]; then
              echo "::error::operator-recon pattern detected — see v4.0.1 sanitization"
              echo "$hits"
              exit 1
            fi
            echo "leak guard: clean"
