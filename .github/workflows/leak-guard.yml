name: Leak guard

# Fail the build if any operator-recon / internal-infra / client / drone string
# lands in the public tree. Patterns are the v4.0.1-scrubbed set, broadened to a
# CGNAT range + fleet/client/drone/secret shapes (see public-branch leak sweep
# 2026-06-14: 7 of 9 active branches had reverted-scrub leaks because this guard
# only ran on master/main/next — it now runs on EVERY branch push).
#
# Self-integrity: the job also fails if this guard file or the /docs/plans/
# keep-private .gitignore entry is removed, or if any docs/plans/ file becomes
# tracked (that exact reversion is how the leaks re-entered).
#
# To intentionally include a matched string (e.g. a release note describing the
# scrub itself), put `leak-guard-allow` somewhere on the same line.

on:
    push:
      branches: ['**']
      tags: ['v*']
    pull_request:

jobs:
    grep:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Self-integrity (guard + keep-private policy must remain)
          shell: bash
          run: |
            set -e
            test -f .github/workflows/leak-guard.yml || { echo "::error::leak-guard.yml is missing — do not remove the guard"; exit 1; }
            grep -qE '^/docs/plans/' .gitignore || { echo "::error::.gitignore lost its '/docs/plans/' keep-private entry"; exit 1; }
            tracked=$(git ls-files 'docs/plans/' || true)
            if [ -n "$tracked" ]; then
              echo "::error::internal docs/plans/ files are tracked (must stay gitignored):"
              echo "$tracked"
              exit 1
            fi
            echo "self-integrity: ok"
        - name: Pattern scan
          shell: bash
          run: |
            set -e
            # Operator-recon + fleet/CGNAT + client + drone-canary + secret shapes.
            # CGNAT range covers all current+future 100.64.0.0/10 tailnet IPs
            # (old guard hardcoded 5 specific IPs and missed the live Studio
            # node 100.97.7.123 and the roof Pi 100.115.30.12).
            # NB: bare ZEMOG/AIGP word-patterns are intentionally NOT here — they
            # false-match CLAUDE.md/SHIMS.md meta-docs that legitimately state the
            # drone code is PRIVATE. Drone protection = the tools/uav/ gitignore +
            # the private repo; MAVSDK stays as a flight-code canary. (macOS git
            # grep ignores \b — verify \b-patterns on Linux/CI, not locally.)
            patterns='100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}|zemog@|user@100|reillygomez@|ledaticempire@|/Users/ledaticempire|/Users/reillygomez|/Users/user|/home/zemog|\bDetro\b|D0ATHQ1BQD7|\bbrockbro2\b|MAVSDK|Great Lakes|Drive Digital|slack_token[[:space:]]*=|BEACON_TOKEN[[:space:]]*=[[:space:]]*[A-Za-z0-9]'
            # Excludes:
            #   - the guard itself (documents the patterns)
            #   - CHANGELOG.md (records the scrubs)
            #   - releases/* (frozen attested snapshots; rewriting breaks chains)
            #     carry literal PRIVATE KEY blocks; not operator data)
            #     citations coincidentally match the CGNAT range)
            # -I skips binaries (rail_native etc. embed link-time path strings).
            hits=$(git grep -InE "$patterns" -- \
              ':(exclude).github/workflows/leak-guard.yml' \
              ':(exclude)CHANGELOG.md' \
              ':(exclude)releases/' \
              | grep -v 'leak-guard-allow' || true)
            if [ -n "$hits" ]; then
              echo "::error::operator-recon / internal / client / drone pattern detected — see v4.0.1 sanitization + 2026-06-14 sweep"
              echo "$hits"
              exit 1
            fi
            echo "leak guard: clean"
