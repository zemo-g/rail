name: CI

on:
    push:
      branches: [master, main, next]
      tags: ['v*']
    pull_request:
      branches: [master, main, next]

jobs:
    test:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: Run test suite (n/n)
          shell: bash
          run: |
            set +e
            ./rail_native test 2>&1 | tee /tmp/test.out
            line=$(tail -1 /tmp/test.out | grep -oE "^[0-9]+/[0-9]+ tests passed" | head -1)
            if [ -z "$line" ]; then
              echo "no n/n summary line found"
              tail -20 /tmp/test.out
              exit 1
            fi
            pass=$(printf '%s' "$line" | cut -d/ -f1)
            total=$(printf '%s' "$line" | awk -F'[/ ]' '{print $2}')
            echo "summary: $pass passed / $total total"
            if [ "$pass" != "$total" ]; then
              echo "--- failing-test summary ---"
              grep -E "FAIL|^--- " /tmp/test.out | tail -40
              exit 1
            fi
        - name: Self-compile (fixed point)
          # The compiler inlines the pure-Rail linker (tools/v5/link_lib.rail), so
          # self_compile needs an arena (the default 1GB thrashes the bigger source).
          # CI uses the as/ld fallback (RAIL_ARENA_MB<5000) because the in-process
          # rail-link path peaks ~8.5GB, over a 7GB macos runner. This still proves
          # the compiler self-compiles to a byte-identical fixed point; the rail-link
          # reproduction (RAIL_ARENA_MB=6000) is verified locally + is the committed seed.
          run: |
            RAIL_ARENA_MB=4000 ./rail_native self
            cp /tmp/rail_self ./rail_gen1
            RAIL_ARENA_MB=4000 ./rail_gen1 self
            diff <(xxd /tmp/rail_self) <(xxd ./rail_gen1) && echo "Fixed point: gen1 == gen2"
