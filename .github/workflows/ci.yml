name: CI

on:
    push:
      branches: [master, main]
    pull_request:
      branches: [master, main]

jobs:
    test:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: Run test suite (137/137)
          run: |
            output=$(./rail_native test 2>&1)
            result=$(echo "$output" | tail -1)
            echo "$result"
            if ! echo "$result" | grep -q "137/137 tests passed"; then
              echo "--- full output ---"
              echo "$output" | grep -E "FAIL|^--- |tests passed" | tail -40
              exit 1
            fi
        - name: Self-compile (fixed point)
          run: |
            ./rail_native self
            cp /tmp/rail_self ./rail_gen1
            ./rail_gen1 self
            diff <(xxd /tmp/rail_self) <(xxd ./rail_gen1) && echo "Fixed point: gen1 == gen2"
