name: CI

on:
    push:
      branches: [master, main, next]
      tags: ['v*']
    pull_request:
      branches: [master, main, next]

jobs:
    test:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: Run test suite (n/n)
          shell: bash
          run: |
            set +e
            ./rail_native test 2>&1 | tee /tmp/test.out
            line=$(tail -1 /tmp/test.out | grep -oE "^[0-9]+/[0-9]+ tests passed" | head -1)
            if [ -z "$line" ]; then
              echo "no n/n summary line found"
              tail -20 /tmp/test.out
              exit 1
            fi
            pass=$(printf '%s' "$line" | cut -d/ -f1)
            total=$(printf '%s' "$line" | awk -F'[/ ]' '{print $2}')
            echo "summary: $pass passed / $total total"
            if [ "$pass" != "$total" ]; then
              echo "--- failing-test summary ---"
              grep -E "FAIL|^--- " /tmp/test.out | tail -40
              exit 1
            fi
        - name: Self-compile (fixed point)
          run: |
            ./rail_native self
            cp /tmp/rail_self ./rail_gen1
            ./rail_gen1 self
            diff <(xxd /tmp/rail_self) <(xxd ./rail_gen1) && echo "Fixed point: gen1 == gen2"
