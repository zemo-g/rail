name: CI

on:
    push:
      branches: [master, main]
    pull_request:
      branches: [master, main]

jobs:
    test:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: Build libtensor_gpu.dylib (Metal foreign bindings)
          # Four tensor_* tests link against tgl_* foreign symbols defined
          # in tools/metal/tensor_gpu_lib.m (Metal-backed matmul/relu/etc.).
          # The dylib isn't checked in (build artifact); without it those
          # tests fail at link with "Undefined symbols for architecture
          # arm64: _tgl_init …".  Build before the test suite runs.
          run: |
            cd tools/metal
            clang -shared -fobjc-arc \
              -framework Metal -framework Foundation \
              -install_name "$PWD/libtensor_gpu.dylib" \
              tensor_gpu_lib.m -o libtensor_gpu.dylib
            ls -la libtensor_gpu.dylib
        - name: Run test suite (137/137)
          shell: bash
          run: |
            set +e
            ./rail_native test 2>&1 | tee /tmp/test.out
            tail -1 /tmp/test.out | grep -q "137/137 tests passed"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "--- failing-test summary ---"
              grep -E "FAIL|^--- " /tmp/test.out | tail -40
            fi
            exit $rc
        - name: Self-compile (fixed point)
          run: |
            ./rail_native self
            cp /tmp/rail_self ./rail_gen1
            ./rail_gen1 self
            diff <(xxd /tmp/rail_self) <(xxd ./rail_gen1) && echo "Fixed point: gen1 == gen2"
        - name: CI run attestation
          # Pin this CI run to a live entropy beacon pulse_id.  The result
          # is a citable physical record: "this commit's tests + self-host
          # passed during the real-time window bracketed by these pulses,
          # and the GitHub Actions run id is the chain of custody."
          # No Ed25519 signing here (Pi witness key isn't on the runner);
          # the daily LaunchAgent at home re-signs production separately.
          if: always()
          shell: bash
          run: |
            set +e
            tests_status="ok"
            tail -1 /tmp/test.out 2>/dev/null | grep -q "137/137 tests passed" || tests_status="fail"
            pulse_url="https://ledatic.org/entropy/pulse"
            snap=$(curl -sf --max-time 5 "$pulse_url" || echo '{}')
            pulse_id=$(printf '%s' "$snap" | python3 -c "import sys,json
try: print(json.load(sys.stdin).get('pulse_id',0))
except Exception: print(0)")
            value_hex=$(printf '%s' "$snap" | python3 -c "import sys,json
try: print(json.load(sys.stdin).get('value_hex',''))
except Exception: print('')")
            cat > ci-attestation.json <<JSON
            {
              "kind": "ledatic.ci.run",
              "version": 1,
              "commit": "${GITHUB_SHA}",
              "ref": "${GITHUB_REF}",
              "run_id": "${GITHUB_RUN_ID}",
              "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "tests_status": "${tests_status}",
              "pulse_id": ${pulse_id:-0},
              "value_hex": "${value_hex}",
              "completed_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
            JSON
            cat ci-attestation.json
        - uses: actions/upload-artifact@v4
          if: always()
          with:
            name: ci-attestation
            path: ci-attestation.json
            retention-days: 90
