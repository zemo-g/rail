name: CI

on:
    push:
      branches: [master, main]
    pull_request:
      branches: [master, main]

jobs:
    test:
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v4
        - name: Build libtensor_gpu.dylib (Metal foreign bindings)
          # Four tensor_* tests link against tgl_* foreign symbols defined
          # in tools/metal/tensor_gpu_lib.m (Metal-backed matmul/relu/etc.).
          # The dylib isn't checked in (build artifact); without it those
          # tests fail at link with "Undefined symbols for architecture
          # arm64: _tgl_init …".  Build before the test suite runs.
          run: |
            cd tools/metal
            clang -shared -fobjc-arc \
              -framework Metal -framework Foundation \
              -install_name "$PWD/libtensor_gpu.dylib" \
              tensor_gpu_lib.m -o libtensor_gpu.dylib
            ls -la libtensor_gpu.dylib
        - name: Run test suite (137/137)
          shell: bash
          run: |
            set +e
            ./rail_native test 2>&1 | tee /tmp/test.out
            tail -1 /tmp/test.out | grep -q "137/137 tests passed"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "--- failing-test summary ---"
              grep -E "FAIL|^--- " /tmp/test.out | tail -40
            fi
            exit $rc
        - name: Self-compile (fixed point)
          run: |
            ./rail_native self
            cp /tmp/rail_self ./rail_gen1
            ./rail_gen1 self
            diff <(xxd /tmp/rail_self) <(xxd ./rail_gen1) && echo "Fixed point: gen1 == gen2"
